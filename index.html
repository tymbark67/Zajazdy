<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weryfikacja Bezpieczeństwa Połączenia</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #7f8c8d;
            font-size: 16px;
        }
        .ip-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #ecf0f1;
            border-radius: 4px;
            font-family: monospace;
            font-size: 18px;
            color: #2980b9;
            font-weight: bold;
            word-break: break-all;
        }
        .loading {
            color: #e67e22;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Twoje Połączenie</h1>
    <p>Poniżej znajduje się adres IP, z którego aktualnie łączysz się z tą stroną:</p>
    
    <div id="ip-display" class="ip-box loading">Pobieranie adresu IP...</div>
</div>

<script>
    async function pobierzIP() {
        const wyswietlacz = document.getElementById('ip-display');
        
        // Metoda 1: Próba pobrania z ipapi.co (często pomijane przez AdBlocki)
        try {
            const odpowiedz = await fetch('https://ipapi.co');
            if (!odpowiedz.ok) throw new Error('Błąd ipapi');
            const dane = await odpowiedz.json();
            wyswietlacz.innerText = dane.ip;
            wyswietlacz.classList.remove('loading');
            return; // Sukces, kończymy działanie
        } catch (e) {
            console.log("Metoda 1 zablokowana lub nieudana, próbuję metody zapasowej...");
        }

        // Metoda 2 (Zapasowa): Próba pobrania z api.ipify.org
        try {
            const odpowiedz = await fetch('https://ipify.org');
            if (!odpowiedz.ok) throw new Error('Błąd ipify');
            const dane = await odpowiedz.json();
            wyswietlacz.innerText = dane.ip;
            wyswietlacz.classList.remove('loading');
            return;
        } catch (e) {
            console.log("Metoda 2 również zawiodła.");
        }

        // Jeśli oba źródła zostały zablokowane przez przeglądarkę / AdBlock
        wyswietlacz.innerText = "Zablokowano pobieranie IP (wyłącz AdBlocka dla tej strony).";
        wyswietlacz.style.color = "#c0392b";
    }

    window.onload = pobierzIP;
</script>

</body>
</html>
