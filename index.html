<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Czy jestes gotowy?</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; font-family: "Comic Sans MS", "Segoe UI", sans-serif; }

  #intro {
    position:fixed; inset:0;
    background: #0b0b0f;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:100;
    transition: opacity 0.6s ease;
  }
  #intro h1 {
    color:#fff;
    font-size: clamp(28px, 6vw, 60px);
    text-align:center;
    margin-bottom:40px;
    text-shadow: 0 0 20px rgba(255,255,255,0.5);
    animation: pulse 1.6s infinite ease-in-out;
  }
  @keyframes pulse {
    0%,100% { transform:scale(1); }
    50% { transform:scale(1.06); }
  }
  #intro .buttons { display:flex; gap:30px; flex-wrap:wrap; justify-content:center; }
  .bigbtn {
    font-size: clamp(20px, 3vw, 32px);
    padding: 18px 50px;
    border-radius: 50px;
    border: none;
    cursor:pointer;
    background: linear-gradient(90deg,#ff004c,#ff8a00,#ffe600,#00ff6a,#00c8ff,#7a00ff);
    background-size: 400% 400%;
    animation: rainbowShift 3s linear infinite;
    color:#fff;
    font-weight:bold;
    text-shadow: 0 0 6px rgba(0,0,0,0.6);
    box-shadow: 0 0 25px rgba(255,255,255,0.4);
    transition: transform 0.15s ease;
  }
  .bigbtn:hover { transform: scale(1.1); }
  .bigbtn:active { transform: scale(0.95); }

  @keyframes rainbowShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  #main {
    position:fixed; inset:0;
    display:none;
    background: linear-gradient(270deg, #ff004c, #ff8a00, #ffe600, #00ff6a, #00c8ff, #7a00ff, #ff004c);
    background-size: 1400% 1400%;
    animation: rainbowBg 20s linear infinite;
    overflow:hidden;
  }
  @keyframes rainbowBg {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
  }

  .flyer {
    position:absolute;
    top:0; left:0;
    width: 280px;
    height: auto;
    border-radius: 16px;
    box-shadow: 0 0 25px rgba(255,255,255,0.6), 0 0 45px rgba(0,0,0,0.3);
    pointer-events:none;
    z-index: 5;
  }


</style>
</head>

    <h1>Czy jestes na to gotowy?</h1>
    <div class="buttons">
      <button class="bigbtn" onclick="start()">Tak</button>

  </div>

    function start() {
      document.getElementById('intro').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('intro').style.display = 'none';
      }, 600);

      document.getElementById('main').style.display = 'block';

      spawnFlyers();
    }

    function spawnFlyers() {
      const main = document.getElementById('main');
      const count = 8;

      for (let i = 0; i < count; i++) {
        const img = document.createElement('img');
        img.src = IMG_SRC;
        img.className = 'flyer';
        main.appendChild(img);
        animateFlyer(img);
      }
    }

    function animateFlyer(img) {
      const size = 280;
      let x = Math.random() * (window.innerWidth - size);
      let y = Math.random() * (window.innerHeight - size);
      let vx = (Math.random() * 4 + 2) * (Math.random() < 0.5 ? 1 : -1);
      let vy = (Math.random() * 4 + 2) * (Math.random() < 0.5 ? 1 : -1);
      let rot = Math.random() * 360;
      let vr = (Math.random() * 3 + 1) * (Math.random() < 0.5 ? 1 : -1);

      function frame() {
        const ww = window.innerWidth;
        const hh = window.innerHeight;

        x += vx;
        y += vy;
        rot += vr;

        if (x <= 0) { x = 0; vx = Math.abs(vx); }
        if (x + size >= ww) { x = ww - size; vx = -Math.abs(vx); }
        if (y <= 0) { y = 0; vy = Math.abs(vy); }
        if (y + size >= hh) { y = hh - size; vy = -Math.abs(vy); }

        img.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;

        requestAnimationFrame(frame);
      }
      frame();
    }
  </script>
