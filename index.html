<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zajazd u ?</title>
    <style>
        /* Najbardziej stabilny, tradycyjny układ blokowy - bez błędów */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        html { scroll-behavior: smooth; }
        
        body { 
            background-color: #f8fafc; 
            color: #111111; 
            display: block; 
            overflow-x: hidden; 
            overflow-y: scroll !important; 
        }
        
        /* GÓRNE MENU */
        header { background: white; border-bottom: 1px solid #eaeaea; width: 100%; display: block; position: sticky; top: 0; z-index: 50; }
        .nav-container { max-width: 1000px; margin: 0 auto; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .logo-top { font-size: 20px; font-weight: 900; color: #111111; text-decoration: none; letter-spacing: -0.5px; }
        nav { display: flex; gap: 24px; }
        nav a { font-size: 13px; font-weight: 700; color: #555c66; text-decoration: none; padding-bottom: 5px; border-bottom: 2px solid transparent; transition: all 0.2s; }
        nav a:hover { color: #111111; border-bottom: 2px solid #111111; }
        
        /* SEKCJA GŁÓWNA */
        .hero-section { max-width: 1000px; margin: 50px auto; padding: 20px; text-align: center; display: block; }
        
        /* ROZEŚMIANY LUDZIK W ŻÓŁTEJ KORONIE (BEZ MIECZA) */
        .hero-image { display: block; margin: 0 auto 40px auto; width: 220px; height: 260px; position: relative; }
        .character-svg { 
            width: 220px; 
            height: auto; 
            animation: super-smiech 0.3s linear infinite alternate; 
            filter: drop-shadow(0px 15px 20px rgba(0,0,0,0.15)); 
        }
        
        /* Animacja głośnego śmiechu i trzęsienia się */
        @keyframes super-smiech {
            0% { transform: translateY(0) rotate(-1.5deg); }
            50% { transform: translateY(-7px) rotate(1.5deg); }
            100% { transform: translateY(-1px) rotate(-1deg); }
        }
        .shadow-ellipse { width: 120px; height: 10px; background: rgba(0, 0, 0, 0.1); border-radius: 50%; margin: 5px auto 0 auto; filter: blur(4px); }
        
        /* TEKSTY I PRZYCISK */
        .hero-content { display: block; max-width: 700px; margin: 0 auto; }
        h1 { font-size: 54px; font-weight: 800; letter-spacing: -2px; margin-bottom: 20px; text-transform: uppercase; color: #111111; }
        .desc { color: #555c66; font-size: 17px; line-height: 1.7; margin-bottom: 35px; }
        .btn-black { padding: 16px 40px; font-weight: 700; font-size: 14px; border: none; border-radius: 10px; cursor: pointer; background-color: #111111; color: white; text-decoration: none; display: inline-block; box-shadow: 0 10px 15px -3px rgba(17, 24, 39, 0.2); transition: all 0.2s; }
        .btn-black:hover { background-color: #1f2937; transform: translateY(-2px); }

        /* SEKCJA WYBORU USŁUGI (KAFELEK) */
        .tickets-section { background-color: #ffffff; padding: 90px 20px; text-align: center; width: 100%; border-top: 1px solid #e2e8f0; display: block; margin-top: 60px; }
        .section-title { font-size: 36px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; color: #111111; text-transform: uppercase; }
        .section-subtitle { color: #666666; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; margin-bottom: 50px; text-transform: uppercase; }
        
        .tickets-container { display: flex; justify-content: center; max-width: 1200px; margin: 0 auto; }
        .ticket-card { 
            background: white; 
            padding: 45px 35px; 
            border-radius: 20px; 
            width: 360px; 
            border: 1px solid #e2e8f0; 
            box-shadow: 0 10px 30px -5px rgba(0,0,0,0.03); 
            text-align: center; 
            display: inline-block; 
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease-in-out;
        }
        .ticket-card:hover { transform: translateY(-8px); border-color: #111111; box-shadow: 0 20px 35px -10px rgba(0,0,0,0.08); }
        .ticket-card::after { content: ''; position: absolute; top: 0; left: -150%; width: 50%; height: 100%; background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%); transform: skewX(-25deg); }
        .ticket-card:hover::after { animation: shine 0.8s ease-in-out; }
        @keyframes shine { 100% { left: 150%; } }
        
        .black-badge { background-color: #111111; color: white; font-weight: 800; padding: 8px 22px; border-radius: 6px; font-size: 13px; text-transform: uppercase; display: inline-block; margin-bottom: 25px; }
        .ticket-name { font-size: 20px; font-weight: 700; margin-bottom: 12px; color: #111111; }
        .ticket-price { font-size: 36px; font-weight: 850; color: #111111; margin-bottom: 25px; }
        .card-btn { display: block; width: 100%; text-align: center; background-color: #111111; color: white; padding: 14px; font-size: 13px; text-decoration: none; font-weight: 700; border-radius: 8px; text-transform: uppercase; }
        
        /* WYSTYLIZOWANA STOPKA (Z KRESECZKAMI I DOKUMENTAMI) */
        footer { background: white; border-top: 1px solid #eaeaea; padding: 40px 20px; width: 100%; display: block; margin-top: 80px; }
        .footer-container { 
            max-width: 1000px; 
            margin: 0 auto; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            gap: 20px;
            padding-bottom: 25px;
            border-bottom: 1px solid #f1f5f9; /* Środkowa kreseczka separatora */
        }
        
        /* Przycisk TikTok po lewej */
        .footer-socials { display: flex; align-items: center; }
        .tiktok-btn { 
            width: 100px; 
            height: 38px; 
            background: #111111; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            font-size: 11px; 
            font-weight: 800; 
            cursor: pointer; 
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .tiktok-btn:hover { background-color: #1f2937; transform: translateY(-2px); }
        
        /* Logo Z? na środku */
        .footer-logo-center { font-size: 15px; font-weight: 900; color: #111111; background: #f1f5f9; padding: 6px 14px; border-radius: 6px; border: 1px solid #cbd5e1; }
        
        /* Bilet i Regulamin po prawej z kreseczkami na hover */
        .footer-links { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
        .footer-links a { 
            font-size: 11px; 
            font-weight: 700; 
            color: #64748b; 
            text-decoration: none; 
            text-transform: uppercase; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            transition: all 0.2s;
            padding-bottom: 2px;
            border-bottom: 1px solid transparent;
        }
        .footer-links a:hover { color: #111111; border-bottom: 1px solid #111111; }
        
        .icon-box { font-size: 10px; border: 1px solid #cbd5e1; padding: 3px 6px; border-radius: 4px; background: #f8fafc; display: inline-block; line-height: 1; }
        
        /* Wielki, ładny podpis na samym dole strony */
        .credits-section { text-align: center; margin-top: 25px; font-size: 12px; font-weight: 800; color: #94a3b8; letter-spacing: 3px; text-transform: uppercase; }
    </style>
</head>
<body>

    <!-- GÓRNE MENU -->
    <header>
        <div class="nav-container">
            <a href="#" class="logo-top">ZAJAZD.PL</a>
            <nav>
                <a href="#">STRONA GŁÓWNA</a>
                <a href="#bilety">BILET</a>
                <a href="#footer-links-block">REGULAMIN</a>
            </nav>
        </div>
    </header>

    <!-- SEKCJA GŁÓWNA -->
    <main class="hero-section">
        
        <!-- ULEPSZONY, ROZEŚMIANY LUDZIK (ZĄBKI, ŻÓŁTA KORONA, BEZ MIECZA) -->
        <div class="hero-image">
            <svg class="character-svg" viewBox="0 0 200 300" xmlns="http://w3.org">
                <!-- Wyraźna Żółta Korona z cieniowaniem -->
                <path d="M55 35 L78 58 L100 35 L122 58 L145 35 L135 75 L65 75 Z" fill="#eab308"/>
                <path d="M78 58 L100 35 L122 58 L100 75 Z" fill="#ca8a04" opacity="0.4"/>
                
                <!-- Głowa -->
                <rect x="65" y="75" width="70" height="70" rx="12" fill="#0f172a"/>
                
                <!-- Roześmiane oczy -->
                <rect x="76" y="96" width="16" height="10" fill="#ffffff" rx="2"/>
                <rect x="82" y="99" width="6" height="6" fill="#000000"/>
                <rect x="108" y="96" width="16" height="10" fill="#ffffff" rx="2"/>
                <rect x="114" y="99" width="6" height="6" fill="#000000"/>
                
                <!-- GŁOŚNY ŚMIECH: Szeroko otwarte usta z ząbkami -->
                <path d="M 74 118 Q 100 148 126 118 Z" fill="#ffffff"/>
                <path d="M 74 118 Q 100 148 126 118" stroke="#cbd5e1" stroke-width="2" fill="none"/>
                
                <!-- Korpus bez broni -->
                <rect x="45" y="150" width="110" height="95" rx="16" fill="#0f172a"/>
                <rect x="94" y="160" width="12" height="70" fill="#1e293b" rx="4"/>
            </svg>
            <div class="shadow-ellipse"></div>
        </div>

        <div class="hero-content">
            <h1>ZAJAZD U ?</h1>
