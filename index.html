<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zajazdy.pl - Serwer Minecraft</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col justify-between">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <span class="text-2xl font-black text-emerald-600 tracking-tight">ZAJAZDY.PL</span>
            <nav class="flex space-x-6 text-sm font-semibold text-gray-600">
                <a href="#" class="text-emerald-600 border-b-2 border-emerald-600 pb-1">STRONA GŁÓWNA</a>
                <a href="#">DOKUMENTY</a>
                <a href="#">VOUCHER</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-12 flex flex-col md:flex-row items-center justify-between">
        <div class="w-full md:w-1/2 text-center md:text-left space-y-6">
            <div class="inline-flex items-center space-x-2 bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-full">
                <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span>
                <span id="licznik-graczy" class="text-xs font-bold text-emerald-700 tracking-wide uppercase">Sprawdzanie statusu...</span>
            </div>

            <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight text-gray-900">ZAJAZDY.PL</h1>
            <p class="text-gray-500 text-lg max-w-md">Wszystkie najnowsze informacje i aktualizacje znajdziesz na naszym Discordzie!</p>

            <div class="flex flex-col sm:flex-row items-center justify-center md:justify-start gap-4">
                <button id="przycisk-graj" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-3.5 rounded-xl shadow-lg transition">ZAGRAJ TERAZ</button>
                <button id="przycisk-discord" class="w-full sm:w-auto bg-gray-900 hover:bg-gray-800 text-white font-bold px-8 py-3.5 rounded-xl shadow-lg transition">DOŁĄCZ DO NAS</button>
            </div>
            <p id="alert-kopia" class="text-sm font-semibold text-emerald-600 opacity-0 transition-opacity duration-300">⚡ Skopiowano IP do schowka!</p>
        </div>
    </main>

    <script src="skrypt.js"></script>
</body>
</html>
