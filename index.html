<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weryfikacja Bezpieczeństwa Połączenia</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #7f8c8d;
            font-size: 16px;
        }
        .ip-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #ecf0f1;
            border-radius: 4px;
            font-family: monospace;
            font-size: 18px;
            color: #2980b9;
            font-weight: bold;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Twoje Połączenie</h1>
    <p>Poniżej znajduje się adres IP, z którego aktualnie łączysz się z tą stroną:</p>
    
    <!-- Miejsce na adres IP -->
    <div id="ip-display" class="ip-box">Pobieranie adresu...</div>
</div>

<!-- Ten skrypt pobiera dane z Cloudflare w sposób, którego AdBlock nie zablokuje -->
<script>
    function klientIP(dane) {
        // Cloudflare zwraca tekst linia po linii, szukamy tej zaczynającej się od "ip="
        const linie = dane.split('\n');
        const liniaIP = linie.find(l => l.startsWith('ip='));
        if (liniaIP) {
            const ip = liniaIP.split('=')[1];
            document.getElementById('ip-display').innerText = ip;
        } else {
            document.getElementById('ip-display').innerText = "Nie udało się odczytać IP.";
        }
    }
</script>
<!-- Wywołanie oficjalnego i bezpiecznego endpointu Cloudflare jako skryptu tekstowego -->
<script src="https://cloudflare.com"></script>

</body>
</html>
