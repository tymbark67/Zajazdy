<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zajazdy.pl - Serwer Minecraft</title>
    <style>
        /* Profesjonalny pakiet nowoczesnych stylów CSS wbudowany w stronę */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f9fafb; color: #111827; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* Menu górne */
        header { background: white; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 50; }
        .nav-container { max-width: 1200px; margin: 0 auto; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .logo { font-size: 24px; font-weight: 900; color: #059669; letter-spacing: -1px; }
        nav a { font-size: 14px; font-weight: 600; color: #4b5563; text-decoration: none; margin-left: 24px; transition: color 0.2s; }
        nav a:hover, nav a.active { color: #059669; }
        
        /* Sekcja główna */
        main { flex-grow: 1; max-width: 1200px; width: 100%; margin: 0 auto; padding: 80px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .hero-content { max-width: 600px; text-align: center; }
        
        h1 { font-size: 64px; font-weight: 800; letter-spacing: -2px; margin-bottom: 16px; color: #111827; }
        .desc { color: #6b7280; font-size: 18px; margin-bottom: 32px; line-height: 1.6; }
        
        /* Przyciski */
        .buttons { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 14px 48px; font-weight: 700; font-size: 15px; border-radius: 12px; border: none; cursor: pointer; transition: all 0.2s; text-decoration: none; display: inline-block; }
        .btn-green { background: #059669; color: white; box-shadow: 0 10px 15px -3px rgba(5, 150, 105, 0.3); }
        .btn-green:hover { background: #047857; transform: translateY(-2px); }
        
        /* Alert o kopiowaniu */
        #alert-kopia { margin-top: 20px; font-size: 14px; font-weight: 600; color: #059669; opacity: 0; transition: opacity 0.3s; }
        
        /* Stopka */
        footer { background: #111827; color: #9ca3af; text-align: center; padding: 20px; font-size: 12px; border-top: 1px solid #1f2937; }
    </style>
</head>
<body>

    <!-- MENU GÓRNE -->
    <header>
        <div class="nav-container">
            <span class="logo">ZAJAZDY.PL</span>
            <nav>
                <a href="#" class="active">STRONA GŁÓWNA</a>
                <a href="#">DOKUMENTY</a>
                <a href="#">BILET</a>
            </nav>
        </div>
    </header>

    <!-- SEKCJA GŁÓWNA -->
    <main>
        <div class="hero-content">
            <h1>ZAJAZDY.PL</h1>
            <p class="desc">Wszystkie najnowsze informacje i aktualizacje znajdziesz na naszym Discordzie! Dołącz do wspólnej gry.</p>

            <div class="buttons">
                <button id="przycisk-graj" class="btn btn-green">ZAGRAJ TERAZ</button>
            </div>
            
            <p id="alert-kopia">⚡ Skopiowano IP serwera do schowka! (mc.zajazdy.pl)</p>
        </div>
    </main>

    <!-- LOGIKA DO DZIAŁANIA PRZYCISKU -->
    <script>
        const IP_SERWERA = "mc.zajazdy.pl";

        // Kopiowanie IP po kliknięciu "ZAGRAJ TERAZ"
        document.getElementById('przycisk-graj').addEventListener('click', () => {
            navigator.clipboard.writeText(IP_SERWERA).then(() => {
                const alert = document.getElementById('alert-kopia');
                alert.style.opacity = '1';
                setTimeout(() => { alert.style.opacity = '0'; }, 3000);
            });
        });
    </script>

    <!-- STOPKA -->
    <footer>
        <p>&copy; 2026 zajazdy.pl. Wszelkie prawa zastrzeżone. Strona nie jest powiązana z firmą Mojang.</p>
    </footer>

</body>
</html>
